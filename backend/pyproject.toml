[project]
name = "bhayanak-legends"
version = "0.1.0"
description = "Bhayanak Legends Python sidecar: Findings Pack server, personal-history sync, live-game detection"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "cryptography>=44",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pandas>=2.2", "pyarrow>=17", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bhayanak_legends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
