name: Windows packaged smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  SMOKE_DEBUG_PORT: 24987

jobs:
  packaged-smoke:
    name: Install and smoke packaged Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Reassert byte-pinned Findings Pack checkout
        shell: bash
        run: |
          for path in \
            pack/findings-pack.v2.json \
            pack/pack.schema.json \
            pack/models/live-wp-v2.model-card.json \
            pack/models/live-wp-v2.onnx \
            pack/models/personal-what-if-v2.model-card.json \
            pack/models/personal-what-if-v2.onnx
          do
            git cat-file blob "HEAD:$path" > "$path"
            expected="$(git rev-parse "HEAD:$path")"
            actual="$(git hash-object --no-filters -- "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "checked-out pack file differs from tracked blob: $path"
              exit 1
            fi
          done

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build one-file Windows sidecar
        shell: bash
        run: uv run --project backend --locked python tools/build_windows_sidecar.py

      - name: Generate ephemeral updater signing key
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP "bl-smoke"
          $artifacts = Join-Path $env:RUNNER_TEMP "bl-smoke-artifacts"
          New-Item -ItemType Directory -Force -Path $diagnostics, $artifacts | Out-Null
          $keyPath = Join-Path $artifacts "smoke-updater.key"
          $passwordBytes = New-Object byte[] 32
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($passwordBytes)
          $password = [Convert]::ToBase64String($passwordBytes)
          "::add-mask::$password"
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Parse("127.0.0.1"), 0)
          $listener.Start()
          $fixturePort = $listener.LocalEndpoint.Port
          $listener.Stop()
          pnpm tauri signer generate --ci --password $password -w $keyPath
          $publicKeyPath = "$keyPath.pub"
          if (-not (Test-Path $keyPath)) { throw "ephemeral updater private key was not generated" }
          if (-not (Test-Path $publicKeyPath)) { throw "ephemeral updater public key was not generated" }
          "SMOKE_DIAGNOSTICS=$diagnostics" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_ARTIFACTS=$artifacts" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_PUBLIC_KEY_PATH=$publicKeyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_FIXTURE_PORT=$fixturePort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_LOWER_VERSION=0.1.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_VALID_VERSION=0.1.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_INVALID_VERSION=0.1.2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Copy canonical diagnostic Findings Pack smoke asset
        shell: pwsh
        run: |
          $packDir = Join-Path $env:SMOKE_ARTIFACTS "pack-v2"
          New-Item -ItemType Directory -Force -Path $packDir | Out-Null
          uv run --project backend --locked python backend/tools/build_pack.py `
            --bootstrap --out $packDir
          "SMOKE_PACK_DIR=$packDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build genuinely signed higher-version updater artifact
        shell: pwsh
        run: |
          $endpoint = "http://127.0.0.1:$env:SMOKE_FIXTURE_PORT/latest.json"
          python tools/patch_updater_endpoint.py src-tauri/tauri.conf.json `
            --endpoint $endpoint `
            --browser-args="--remote-debugging-port=$env:SMOKE_DEBUG_PORT" `
            --public-key-file "$env:SMOKE_PUBLIC_KEY_PATH" `
            --version "$env:SMOKE_VALID_VERSION" `
            --allow-insecure-transport `
            --backup "$env:RUNNER_TEMP\tauri.conf.json.smoke-backup"
          if ($LASTEXITCODE -ne 0) { throw "updater smoke configuration patch failed" }
          Remove-Item "src-tauri/target/release/bundle/nsis" -Recurse -Force -ErrorAction SilentlyContinue
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content $env:SMOKE_KEY_PATH -Raw
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:SMOKE_KEY_PASSWORD
          pnpm tauri build --bundles nsis
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          $bundle = "src-tauri/target/release/bundle/nsis"
          $signed = @(
            Get-ChildItem -Path $bundle -File |
              Where-Object {
                ($_.Name -like "*.nsis.zip" -or $_.Name -like "*.exe") -and
                (Test-Path "$($_.FullName).sig")
              }
          )
          if ($signed.Count -ne 1) {
            throw "expected exactly one signed updater archive, found $($signed.Count)"
          }
          $validArtifact = Join-Path $env:SMOKE_ARTIFACTS "valid$($signed[0].Extension)"
          if ($signed[0].Name -like "*.nsis.zip") {
            $validArtifact = Join-Path $env:SMOKE_ARTIFACTS "valid.nsis.zip"
          } else {
            $validArtifact = Join-Path $env:SMOKE_ARTIFACTS "valid.exe"
          }
          $validSignature = "$validArtifact.sig"
          Copy-Item $signed[0].FullName $validArtifact
          Copy-Item "$($signed[0].FullName).sig" $validSignature
          "SMOKE_VALID_ARTIFACT=$validArtifact" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_VALID_SIGNATURE=$validSignature" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and run packaged updater smoke against loopback fixture
        shell: pwsh
        run: |
          $invalidArtifact = Join-Path $env:SMOKE_ARTIFACTS "invalid.nsis.zip"
          $invalidSignature = "$invalidArtifact.sig"
          $bytes = [IO.File]::ReadAllBytes($env:SMOKE_VALID_ARTIFACT)
          if ($bytes.Length -lt 1) { throw "signed updater artifact is empty" }
          $bytes[0] = $bytes[0] -bxor 0xFF
          [IO.File]::WriteAllBytes($invalidArtifact, $bytes)
          Copy-Item $env:SMOKE_VALID_SIGNATURE $invalidSignature
          $stateFile = Join-Path $env:SMOKE_DIAGNOSTICS "updater-fixture.json"
          $stdout = Join-Path $env:SMOKE_DIAGNOSTICS "updater-fixture.log"
          $flipFile = Join-Path $env:RUNNER_TEMP "bl-smoke-invalid-phase"
          $stderr = Join-Path $env:SMOKE_DIAGNOSTICS "updater-fixture.err.log"
          $fixture = Start-Process -FilePath uv -ArgumentList @(
            "run",
            "--project", "backend",
            "--locked",
            "python",
            "tools/windows_updater_fixture.py",
            "--state-file", $stateFile,
            "--port", $env:SMOKE_FIXTURE_PORT,
            "--current-version", $env:SMOKE_LOWER_VERSION,
            "--valid-version", $env:SMOKE_VALID_VERSION,
            "--valid-artifact", $env:SMOKE_VALID_ARTIFACT,
            "--valid-signature", $env:SMOKE_VALID_SIGNATURE,
            "--invalid-version", $env:SMOKE_INVALID_VERSION,
            "--invalid-artifact", $invalidArtifact,
            "--invalid-signature", $invalidSignature,
            "--flip-file", $flipFile,
            "--pack-dir", $env:SMOKE_PACK_DIR
          ) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $fixturePid = "$($fixture.Id)"
          "FIXTURE_PID=$fixturePid" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:FIXTURE_PID = $fixturePid
          "SMOKE_FLIP_FILE=$flipFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SMOKE_FLIP_FILE = $flipFile
          "SMOKE_FIXTURE_STATE=$stateFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SMOKE_FIXTURE_STATE = $stateFile
          for ($attempt = 0; $attempt -lt 60 -and -not (Test-Path $stateFile); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $stateFile)) { throw "updater fixture did not start" }
          $fixtureInfo = Get-Content $stateFile | ConvertFrom-Json
          $fixtureEndpoint = "http://127.0.0.1:$($fixtureInfo.port)/latest.json"
          $manifestUrl = "http://127.0.0.1:$($fixtureInfo.port)/findings-pack-manifest.json"
          $manifestPublicKey = "$($fixtureInfo.manifest_public_key)"
          $packVersion = "$($fixtureInfo.pack_version)"
          "FIXTURE_ENDPOINT=$fixtureEndpoint" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:FIXTURE_ENDPOINT = $fixtureEndpoint
          "BHAYANAK_PACK_RELEASE_MANIFEST_URL=$manifestUrl" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:BHAYANAK_PACK_RELEASE_MANIFEST_URL = $manifestUrl
          "BHAYANAK_PACK_RELEASE_MANIFEST_PUBLIC_KEY=$manifestPublicKey" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:BHAYANAK_PACK_RELEASE_MANIFEST_PUBLIC_KEY = $manifestPublicKey
          "SMOKE_PACK_VERSION=$packVersion" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SMOKE_PACK_VERSION = $packVersion

          python tools/patch_updater_endpoint.py src-tauri/tauri.conf.json `
            --endpoint "$env:FIXTURE_ENDPOINT" `
            --browser-args="--remote-debugging-port=$env:SMOKE_DEBUG_PORT" `
            --public-key-file "$env:SMOKE_PUBLIC_KEY_PATH" `
            --version "$env:SMOKE_LOWER_VERSION" `
            --allow-insecure-transport `
            --reuse-backup `
            --backup "$env:RUNNER_TEMP\tauri.conf.json.smoke-backup"
          if ($LASTEXITCODE -ne 0) { throw "updater smoke configuration patch failed" }
          Remove-Item "src-tauri/target/release/bundle/nsis" -Recurse -Force -ErrorAction SilentlyContinue
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content $env:SMOKE_KEY_PATH -Raw
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:SMOKE_KEY_PASSWORD
          pnpm tauri build --bundles nsis
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
          Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "lower-version Tauri NSIS installer was not produced" }
          "SMOKE_INSTALLER=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SMOKE_INSTALLER = $installer.FullName

          $fixtureProcess = Get-Process -Id ([int]$env:FIXTURE_PID) -ErrorAction SilentlyContinue
          if (-not $fixtureProcess -or $fixtureProcess.HasExited) {
            throw "updater fixture process is no longer running"
          }
          try {
            $response = Invoke-WebRequest -Uri $env:FIXTURE_ENDPOINT -UseBasicParsing -TimeoutSec 10
          } catch {
            throw "updater fixture loopback GET failed: $($_.Exception.Message)"
          }
          if ($response.StatusCode -ne 200) {
            throw "updater fixture loopback GET returned HTTP $($response.StatusCode)"
          }
          try {
            $payload = $response.Content | ConvertFrom-Json
          } catch {
            throw "updater fixture loopback GET returned invalid JSON: $($_.Exception.Message)"
          }
          if ($payload.version -ne $env:SMOKE_VALID_VERSION) {
            throw "updater fixture returned unexpected valid version: $($payload.version)"
          }

          pwsh -File tools/windows_packaged_smoke.ps1 `
            -InstallerPath "$env:SMOKE_INSTALLER" `
            -InstallRoot "$env:RUNNER_TEMP\bl-packaged-install" `
            -DebugPort "$env:SMOKE_DEBUG_PORT" `
            -StatePath "$env:SMOKE_DIAGNOSTICS\smoke-state.json" `
            -FlipFile "$env:SMOKE_FLIP_FILE" `
            -HigherVersion "$env:SMOKE_VALID_VERSION" `
            -RejectedVersion "$env:SMOKE_INVALID_VERSION" `
            -ExpectedPackVersion "$env:SMOKE_PACK_VERSION"

      - name: Verify updater stayed on the local fixture
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path $env:SMOKE_FIXTURE_STATE) {
            python tools/check_windows_smoke_fixture.py `
              "$env:SMOKE_DIAGNOSTICS\updater-fixture.requests.jsonl" `
              --state-file "$env:SMOKE_FIXTURE_STATE"
          }

      - name: Restore release updater configuration
        if: ${{ always() }}
        shell: pwsh
        run: |
          python tools/patch_updater_endpoint.py src-tauri/tauri.conf.json `
            --backup "$env:RUNNER_TEMP\tauri.conf.json.smoke-backup" --restore

      - name: Stop local fixture
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:FIXTURE_PID) {
            Stop-Process -Id ([int]$env:FIXTURE_PID) -Force -ErrorAction SilentlyContinue
          }

      - name: Redact smoke diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          python tools/redact_diagnostics.py `
            "$env:SMOKE_DIAGNOSTICS" "$env:RUNNER_TEMP\bl-smoke-redacted"

      - name: Upload redacted smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packaged-smoke-diagnostics
          path: ${{ runner.temp }}/bl-smoke-redacted
          if-no-files-found: warn

      - name: Remove smoke key material
        if: ${{ always() }}
        shell: pwsh
        run: |
          Remove-Item $env:SMOKE_KEY_PATH, $env:SMOKE_PUBLIC_KEY_PATH -Force -ErrorAction SilentlyContinue
          Remove-Item Env:SMOKE_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:BHAYANAK_PACK_RELEASE_MANIFEST_PUBLIC_KEY -ErrorAction SilentlyContinue
