name: Windows packaged smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  packaged-smoke:
    name: Install and smoke packaged Windows app
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build one-file Windows sidecar
        shell: bash
        run: uv run --project backend --locked python tools/build_windows_sidecar.py

      - name: Start loopback updater fixture
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP "bl-smoke"
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $stateFile = Join-Path $diagnostics "updater-fixture.json"
          $stdout = Join-Path $diagnostics "updater-fixture.log"
          $stderr = Join-Path $diagnostics "updater-fixture.err.log"
          $fixture = Start-Process -FilePath python -ArgumentList @(
            "tools/windows_updater_fixture.py", "--state-file", $stateFile, "--port", "0"
          ) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "FIXTURE_PID=$($fixture.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SMOKE_DIAGNOSTICS=$diagnostics" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          for ($attempt = 0; $attempt -lt 60 -and -not (Test-Path $stateFile); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $stateFile)) { throw "updater fixture did not start" }
          $fixtureInfo = Get-Content $stateFile | ConvertFrom-Json
          "FIXTURE_ENDPOINT=http://127.0.0.1:$($fixtureInfo.port)/latest.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Point updater at local fixture only
        shell: pwsh
        run: |
          python tools/patch_updater_endpoint.py src-tauri/tauri.conf.json `
            --endpoint "$env:FIXTURE_ENDPOINT" `
            --backup "$env:RUNNER_TEMP\tauri.conf.json.smoke-backup"

      - name: Build Tauri installer
        run: pnpm tauri build --bundles nsis

      - name: Launch and assert packaged executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "Tauri NSIS installer was not produced" }
          New-Item -ItemType Directory -Force -Path $env:SMOKE_DIAGNOSTICS | Out-Null
          $debugPort = Get-Random -Minimum 20000 -Maximum 30000
          pwsh -File tools/windows_packaged_smoke.ps1 `
            -InstallerPath $installer.FullName `
            -InstallRoot "$env:RUNNER_TEMP\bl-packaged-install" `
            -DebugPort $debugPort `
            -StatePath "$env:SMOKE_DIAGNOSTICS\smoke-state.json"

      - name: Verify updater stayed on the local fixture
        shell: pwsh
        run: |
          python tools/check_windows_smoke_fixture.py `
            "$env:SMOKE_DIAGNOSTICS\updater-fixture.requests.jsonl"


      - name: Restore release updater configuration
        if: ${{ always() }}
        shell: pwsh
        run: |
          python tools/patch_updater_endpoint.py src-tauri/tauri.conf.json `
            --backup "$env:RUNNER_TEMP\tauri.conf.json.smoke-backup" --restore

      - name: Stop local fixture
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:FIXTURE_PID) {
            Stop-Process -Id ([int]$env:FIXTURE_PID) -Force -ErrorAction SilentlyContinue
          }

      - name: Redact smoke diagnostics
        if: ${{ failure() }}
        shell: pwsh
        run: |
          python tools/redact_diagnostics.py `
            "$env:RUNNER_TEMP\bl-smoke" "$env:RUNNER_TEMP\bl-smoke-redacted"

      - name: Upload redacted smoke diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packaged-smoke-diagnostics
          path: ${{ runner.temp }}/bl-smoke-redacted
          if-no-files-found: warn
