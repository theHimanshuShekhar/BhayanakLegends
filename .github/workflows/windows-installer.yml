name: Manual Windows installer

on:
  push:
    branches: ["build/windows-installer-*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  installer:
    name: Build exact tree for manual Windows testing
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Restore byte-exact canonical pack
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            git cat-file blob "HEAD:$path" > "$path"
            test "$(git hash-object --no-filters -- "$path")" = "$(git rev-parse "HEAD:$path")"
          done < <(git ls-files -z pack)
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
      - name: Install frozen frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Validate canonical pack and prepare unsigned installer override
        shell: pwsh
        run: |
          @'
          import json
          import os
          from pathlib import Path
          from bhayanak_legends.pack import validate_pack_directory

          validate_pack_directory(Path("pack"))
          pack = json.loads(Path("pack/findings-pack.v2.json").read_text(encoding="utf-8"))
          if pack["pack_version"] != "v7":
              raise SystemExit("manual v1 installer requires canonical Findings Pack v7")
          override = Path(os.environ["RUNNER_TEMP"]) / "manual-installer-config.json"
          override.write_text(json.dumps({"bundle": {"createUpdaterArtifacts": False}}), encoding="utf-8")
          '@ | uv run --project backend --locked python -
      - name: Build windowed Python sidecar with canonical pack
        shell: pwsh
        run: uv run --project backend --locked python tools/build_windows_sidecar.py
      - name: Build x64 NSIS installer without updater signing credentials
        shell: pwsh
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config "$env:RUNNER_TEMP/manual-installer-config.json" -- --locked
      - name: Record installer checksum and build provenance
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from bhayanak_legends.version import APP_VERSION
          from tools.build_windows_sidecar import assert_windowed_subsystem

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("checkout differs from triggering commit")
          config = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          if config["version"] != APP_VERSION or package["version"] != APP_VERSION:
              raise SystemExit("application versions differ")
          installers = list(Path("src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis").glob("*.exe"))
          if len(installers) != 1:
              raise SystemExit("expected exactly one fresh NSIS installer")
          assert_windowed_subsystem(Path("src-tauri/binaries/bhayanak-legends-sidecar-x86_64-pc-windows-msvc.exe"))
          destination = Path("manual-installer")
          destination.mkdir()
          installer = destination / installers[0].name
          shutil.copy2(installers[0], installer)
          digest = hashlib.sha256(installer.read_bytes()).hexdigest()
          (destination / "SHA256SUMS.txt").write_text(f"{digest}  {installer.name}\n", encoding="utf-8")
          pack_path = Path("pack/findings-pack.v2.json")
          manifest = {
              "commit": commit, "version": APP_VERSION, "target": "x86_64-pc-windows-msvc",
              "installer": installer.name, "sha256": digest,
              "pack_version": "v7", "pack_sha256": hashlib.sha256(pack_path.read_bytes()).hexdigest(),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "updater_artifacts": False, "published": False,
              "validation": "Built for manual installation; no packaged Windows smoke performed",
          }
          (destination / "build-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          '@ | uv run --project backend --locked python -
      - name: Upload installer and provenance for manual testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-${{ github.sha }}
          path: manual-installer/
          if-no-files-found: error
          retention-days: 14
