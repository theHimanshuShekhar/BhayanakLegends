name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run verification only; never publish a release"
        required: true
        type: boolean
        default: true
      simulate_failure:
        description: "Fail a verification probe to prove publishing stays skipped"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact tagged tree before release
    uses: ./.github/workflows/verify.yml
    with:
      dry_run: ${{ inputs.dry_run || false }}
      simulate_failure: ${{ inputs.simulate_failure || false }}
    permissions:
      contents: read
  packaged-smoke:
    name: Smoke packaged Windows app before release
    uses: ./.github/workflows/windows-smoke.yml
    permissions:
      contents: read
  publish:
    name: Publish signed release
    needs: [verify, packaged-smoke]
    if: ${{ github.event_name == 'push' && needs.verify.result == 'success' && needs.packaged-smoke.result == 'success' }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check out exact tagged tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1

      - name: Build Python sidecar binary
        shell: bash
        run: uv run --project backend --locked python tools/build_windows_sidecar.py
      - name: Build canonical Findings Pack release payload
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --project backend --locked python tools/build_findings_pack_release.py \
            --pack-dir pack \
            --asset "$RUNNER_TEMP/findings-pack.v2.zip" \
            --manifest "$RUNNER_TEMP/findings-pack-manifest.json" \
            --download-url "findings-pack.v2.zip" \
            --min-app-version "0.1.0"

      - name: Sign Findings Pack manifest
        shell: bash
        env:
          FINDINGS_PACK_MANIFEST_SIGNING_KEY: ${{ secrets.FINDINGS_PACK_MANIFEST_SIGNING_KEY }}
        run: |
          uv run --project backend --locked python tools/sign_findings_pack_manifest.py \
            "$RUNNER_TEMP/findings-pack-manifest.json" \
            --output "$RUNNER_TEMP/findings-pack-manifest.json.sig"
      - name: Verify generated Findings Pack payload
        shell: bash
        env:
          PACK_MANIFEST_PATH: ${{ runner.temp }}/findings-pack-manifest.json
          PACK_SIGNATURE_PATH: ${{ runner.temp }}/findings-pack-manifest.json.sig
          PACK_ASSET_PATH: ${{ runner.temp }}/findings-pack.v2.zip
        run: |
          uv run --project backend --locked python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from bhayanak_legends.manifest_signing import verify_manifest_signature

          manifest_path = Path(os.environ["PACK_MANIFEST_PATH"])
          signature_path = Path(os.environ["PACK_SIGNATURE_PATH"])
          asset_path = Path(os.environ["PACK_ASSET_PATH"])
          raw_manifest = manifest_path.read_bytes()
          manifest = json.loads(raw_manifest.decode("utf-8"))
          asset = asset_path.read_bytes()
          if manifest["schema_version"] != 2:
              raise SystemExit("generated Findings Pack manifest is not schema v2")
          if manifest["size"] != len(asset):
              raise SystemExit("generated Findings Pack manifest size is stale")
          if manifest["sha256"] != hashlib.sha256(asset).hexdigest():
              raise SystemExit("generated Findings Pack manifest hash is stale")
          verify_manifest_signature(raw_manifest, signature_path.read_bytes())
          print("generated Findings Pack manifest, payload, and signature match")
          PY


      - name: Verify updater signing prerequisites
        shell: bash
        run: |
          uv run --project backend --locked python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          config_path = Path("src-tauri/tauri.conf.json")
          try:
              config = json.loads(config_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              sys.exit(f"tauri config cannot be read: {exc}")
          if not isinstance(config, dict):
              sys.exit("tauri config must be a JSON object")

          bundle = config.get("bundle")
          if not isinstance(bundle, dict) or bundle.get("createUpdaterArtifacts") is not True:
              sys.exit("createUpdaterArtifacts must be true before publishing")

          plugins = config.get("plugins")
          updater = plugins.get("updater") if isinstance(plugins, dict) else None
          if not isinstance(updater, dict) or not updater.get("pubkey"):
              sys.exit("updater pubkey must be configured before publishing")

          if not os.environ.get("TAURI_SIGNING_PRIVATE_KEY"):
              sys.exit("TAURI_SIGNING_PRIVATE_KEY secret is not provisioned; refusing to publish unsigned updates")
          PY
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Windows updater bundle
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Check Windows updater artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LATEST_JSON="$RUNNER_TEMP/latest.json"
          uv run --project backend --locked python tools/check_windows_updater_artifacts.py \
            --bundle-dir src-tauri/target/release/bundle/nsis \
            --latest-json "$LATEST_JSON" \
            --write-latest-json \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}" \
            --version "$VERSION"

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@564aea5a8075c7a54c167bb0cf5b3255314a7f9d # v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Bhayanak Legends v__VERSION__"
          releaseBody: "Installer + auto-update feed. The Findings Pack is bundled; newer packs arrive via LoLTrends release sync (docs/adr/0005)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Publish Findings Pack channel assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="v${VERSION}"
          gh release upload "$TAG" \
            "$RUNNER_TEMP/findings-pack.v2.zip" \
            "$RUNNER_TEMP/findings-pack-manifest.json" \
            "$RUNNER_TEMP/findings-pack-manifest.json.sig" \
            --clobber

      - name: Verify emitted updater artifacts
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="v${VERSION}"
          ASSETS_FILE="$RUNNER_TEMP/assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$ASSETS_FILE"
          for REQUIRED_ASSET in \
            latest.json \
            findings-pack.v2.zip \
            findings-pack-manifest.json \
            findings-pack-manifest.json.sig
          do
            if ! grep -Fxq "$REQUIRED_ASSET" "$ASSETS_FILE"; then
              echo "$REQUIRED_ASSET missing from release assets"
              exit 1
            fi
          done
          grep -q '\.sig$' "$ASSETS_FILE" || { echo "no updater signature in release assets"; exit 1; }
          echo "updater and Findings Pack channel assets verified"
