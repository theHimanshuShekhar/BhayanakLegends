name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run verification only; never publish a release"
        required: true
        type: boolean
        default: true
      simulate_failure:
        description: "Fail a verification probe to prove publishing stays skipped"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact tagged tree before release
    uses: ./.github/workflows/verify.yml
    with:
      dry_run: ${{ inputs.dry_run || false }}
      simulate_failure: ${{ inputs.simulate_failure || false }}
    permissions:
      contents: read
  packaged-smoke:
    name: Smoke packaged Windows app before release
    uses: ./.github/workflows/windows-smoke.yml
    permissions:
      contents: read
  publish:
    name: Publish signed release
    needs: [verify, packaged-smoke]
    if: ${{ github.event_name == 'push' && needs.verify.result == 'success' && needs.packaged-smoke.result == 'success' }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check out exact tagged tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1

      - name: Build Python sidecar binary
        shell: bash
        run: uv run --project backend --locked python tools/build_windows_sidecar.py

      - name: Sign Findings Pack manifest
        if: ${{ hashFiles('pack/findings-pack-manifest.json') != '' }}
        shell: bash
        env:
          FINDINGS_PACK_MANIFEST_SIGNING_KEY: ${{ secrets.FINDINGS_PACK_MANIFEST_SIGNING_KEY }}
        run: |
          uv run --project backend python tools/sign_findings_pack_manifest.py \
            pack/findings-pack-manifest.json

      - name: Verify updater signing prerequisites
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          config = json.loads(Path("src-tauri/tauri.conf.json").read_text())
          if config.get("bundle", {}).get("createUpdaterArtifacts") is not True:
              sys.exit("createUpdaterArtifacts must be true before publishing")
          if not config.get("plugins", {}).get("updater", {}).get("pubkey"):
              sys.exit("updater pubkey must be configured before publishing")
          if not os.environ.get("TAURI_SIGNING_PRIVATE_KEY"):
              sys.exit("TAURI_SIGNING_PRIVATE_KEY secret is not provisioned; refusing to publish unsigned updates")
          PY
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Windows updater bundle
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Check Windows updater artifacts
        run: |
          uv run --project backend --locked python tools/check_windows_updater_artifacts.py \
            --bundle-dir src-tauri/target/release/bundle/nsis \
            --latest-json "$RUNNER_TEMP/latest.json" \
            --write-latest-json \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${GITHUB_REF_NAME#v}" \
            --version "${GITHUB_REF_NAME#v}"

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@564aea5a8075c7a54c167bb0cf5b3255314a7f9d # v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Bhayanak Legends v__VERSION__"
          releaseBody: "Installer + auto-update feed. The Findings Pack is bundled; newer packs arrive via LoLTrends release sync (docs/adr/0005)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify emitted updater artifacts
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${GITHUB_REF_NAME#v}"
          gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/assets.txt
          grep -q 'latest.json' /tmp/assets.txt || { echo "latest.json missing from release assets"; exit 1; }
          grep -q '\.sig$' /tmp/assets.txt || { echo "no .sig updater signature in release assets"; exit 1; }
          echo "updater artifacts verified"
