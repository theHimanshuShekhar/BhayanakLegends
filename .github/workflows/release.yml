name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run verification only; never publish a release"
        required: true
        type: boolean
        default: true
      simulate_failure:
        description: "Fail a verification probe to prove publishing stays skipped"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact tagged tree before release
    uses: ./.github/workflows/verify.yml
    with:
      dry_run: ${{ inputs.dry_run || false }}
      simulate_failure: ${{ inputs.simulate_failure || false }}
    permissions:
      contents: read

  publish:
    name: Publish signed release
    needs: verify
    if: ${{ github.event_name == 'push' && needs.verify.result == 'success' }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check out exact tagged tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1

      - name: Build Python sidecar binary
        shell: bash
        working-directory: backend
        run: |
          uv sync --locked
          uv run pyinstaller --onefile --name bhayanak-legends-sidecar \
            --add-data "../pack:pack" \
            --collect-submodules bhayanak_legends \
            src/bhayanak_legends/sidecar.py
          mkdir -p ../src-tauri/binaries
          cp dist/bhayanak-legends-sidecar.exe \
            ../src-tauri/binaries/bhayanak-legends-sidecar-x86_64-pc-windows-msvc.exe

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@564aea5a8075c7a54c167bb0cf5b3255314a7f9d # v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Bhayanak Legends v__VERSION__"
          releaseBody: "Installer + auto-update feed. The Findings Pack is bundled; newer packs arrive via LoLTrends release sync (docs/adr/0005)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
