          import base64
          import binascii
          import hashlib
          import json
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          from bhayanak_legends.manifest_signing import verify_manifest_signature
          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          latest_path = Path(sys.argv[1])
          updater_path = Path(sys.argv[2])
          updater_signature_path = Path(sys.argv[3])
          manifest_path = Path(sys.argv[4])
          manifest_signature_path = Path(sys.argv[5])
          asset_path = Path(sys.argv[6])
          expected_version, expected_tag, expected_repo = sys.argv[7:10]

          latest = json.loads(latest_path.read_text(encoding="utf-8"))
          if latest.get("version") != expected_version:
              raise SystemExit("draft latest.json version does not match the release tag")
          platform = latest.get("platforms", {}).get("windows-x86_64")
          if not isinstance(platform, dict):
              raise SystemExit("draft latest.json Windows updater entry is missing")
          url = platform.get("url")
          expected_prefix = (
              f"https://github.com/{expected_repo}/releases/download/{expected_tag}/"
          )
          if not isinstance(url, str) or not url.startswith(expected_prefix):
              raise SystemExit("draft latest.json updater URL is not pinned to the release tag")
          if unquote(urlsplit(url).path.rsplit("/", 1)[-1]) != updater_path.name:
              raise SystemExit("draft latest.json updater URL names the wrong asset")
          updater_signature = updater_signature_path.read_text(encoding="utf-8")
          if platform.get("signature") != updater_signature:
              raise SystemExit("draft latest.json signature differs from the detached signature")

          def payload_line(text: str) -> str:
              for line in text.splitlines():
                  line = line.strip()
                  if line and not line.startswith(("untrusted comment:", "trusted comment:")):
                      return line
              raise ValueError("minisign payload is missing")

          def minisign_payload(text: str, label: str) -> bytes:
              try:
                  return base64.b64decode(payload_line(text), validate=True)
              except (ValueError, binascii.Error) as exc:
                  raise SystemExit(f"{label} has an invalid minisign payload") from exc

          def minisign_signature(text: str, label: str) -> tuple[bytes, bytes, bytes]:
              lines = text.splitlines()
              if (
                  len(lines) != 4
                  or not lines[0].startswith("untrusted comment: ")
                  or not lines[2].startswith("trusted comment: ")
                  or not lines[2][len("trusted comment: ") :].strip()
              ):
                  raise SystemExit(f"{label} is missing a Minisign comment or signature")
              try:
                  primary = base64.b64decode(lines[1].strip(), validate=True)
                  global_signature = base64.b64decode(lines[3].strip(), validate=True)
                  trusted_comment = lines[2][len("trusted comment: ") :].strip().encode("ascii")
              except (UnicodeError, ValueError, binascii.Error) as exc:
                  raise SystemExit(f"{label} has an invalid Minisign signature") from exc
              if len(primary) != 74 or len(global_signature) != 64:
                  raise SystemExit(f"{label} has an invalid Minisign signature size")
              return primary, global_signature, trusted_comment

          config = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          try:
              public_text = base64.b64decode(
                  config["plugins"]["updater"]["pubkey"].encode("ascii"),
                  validate=True,
              ).decode("ascii")
              public_blob = minisign_payload(public_text, "pinned public key")
              signature_text = base64.b64decode(
                  updater_signature.encode("ascii").strip(), validate=True
              ).decode("ascii")
              signature_blob, global_signature, trusted_comment = minisign_signature(
                  signature_text, "draft updater signature"
              )
          except (KeyError, UnicodeError, OSError, ValueError, binascii.Error) as exc:
              raise SystemExit("draft updater signing payload is malformed") from exc
          if len(public_blob) != 42:
              raise SystemExit("pinned updater public key has an invalid Minisign payload")
          if public_blob[:2] != b"Ed" or signature_blob[:2] != b"ED":
              raise SystemExit("draft updater signature uses an unsupported Minisign algorithm")
          if public_blob[2:10] != signature_blob[2:10]:
              raise SystemExit("draft updater signature uses a different pinned key")
          updater_bytes = updater_path.read_bytes()
          updater_digest = hashlib.blake2b(updater_bytes, digest_size=64).digest()
          try:
              verifier = Ed25519PublicKey.from_public_bytes(public_blob[10:])
              verifier.verify(signature_blob[10:], updater_digest)
              verifier.verify(global_signature, signature_blob[10:] + trusted_comment)
          except (InvalidSignature, ValueError) as exc:
              raise SystemExit("draft updater signature does not verify with the pinned public key") from exc

          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes.decode("utf-8"))
          asset = asset_path.read_bytes()
          if manifest.get("schema_version") != 2:
              raise SystemExit("draft Findings Pack manifest is not schema v2")
          if manifest.get("download_url") != "findings-pack.v2.zip":
              raise SystemExit("draft Findings Pack manifest points to an unexpected asset")
          if manifest.get("size") != len(asset):
              raise SystemExit("draft Findings Pack manifest size is stale")
          if manifest.get("sha256") != hashlib.sha256(asset).hexdigest():
              raise SystemExit("draft Findings Pack manifest hash is stale")
          verify_manifest_signature(manifest_bytes, manifest_signature_path.read_bytes())
          print("draft release updater signature, version, hash, and bytes verified")
          PY

      - name: Promote verified release draft
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ID_FILE="$RUNNER_TEMP/release-identity"
          if [[ ! -s "$ID_FILE" || "$(sed -n '1p' "$ID_FILE")" != "$TAG" ]]; then
            echo "release identity marker is missing or points to another tag" >&2
            exit 1
          fi
          EXPECTED_RELEASE_ID="$(sed -n '2p' "$ID_FILE")"
          if [[ ! "$EXPECTED_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "release identity marker has an invalid release ID" >&2
            exit 1
          fi
          RELEASE_STATE="$(gh api \
            --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_ID}" \
            --jq '[.id, .tag_name, .draft] | @tsv')"
          IFS=$'\t' read -r CURRENT_RELEASE_ID CURRENT_TAG CURRENT_DRAFT <<< "$RELEASE_STATE"
          if [[ "$CURRENT_RELEASE_ID" != "$EXPECTED_RELEASE_ID" || "$CURRENT_TAG" != "$TAG" || "$CURRENT_DRAFT" != "true" ]]; then
            echo "refusing to promote a release that is not the verified owned draft" >&2
            exit 1
          fi
          PROMOTION_ATTEMPT="$RUNNER_TEMP/release-promotion-attempt"
          printf '%s\n%s\n' "$TAG" "$EXPECTED_RELEASE_ID" > "$PROMOTION_ATTEMPT"
          gh api \
            --method PATCH \
            --header "Accept: application/vnd.github+json" \
            --field "draft=false" \
            "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_ID}" \
            >/dev/null
          PROMOTION_MARKER="$RUNNER_TEMP/release-promotion-marker"
          printf '%s\n%s\n' "$TAG" "$EXPECTED_RELEASE_ID" > "$PROMOTION_MARKER"

