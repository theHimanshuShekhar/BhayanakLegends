          except (KeyError, UnicodeError, OSError, ValueError, binascii.Error) as exc:
              raise SystemExit("anonymous updater signing payload is malformed") from exc
          if len(public_blob) != 42:
              raise SystemExit("pinned updater public key has an invalid Minisign payload")
          if public_blob[:2] != b"Ed" or signature_blob[:2] != b"ED":
              raise SystemExit("anonymous updater signature uses an unsupported Minisign algorithm")
          if public_blob[2:10] != signature_blob[2:10]:
              raise SystemExit("anonymous updater signature uses a different pinned key")
          updater_bytes = updater_path.read_bytes()
          updater_digest = hashlib.blake2b(updater_bytes, digest_size=64).digest()
          try:
              verifier = Ed25519PublicKey.from_public_bytes(public_blob[10:])
              verifier.verify(signature_blob[10:], updater_digest)
              verifier.verify(global_signature, signature_blob[10:] + trusted_comment)
          except (InvalidSignature, ValueError) as exc:
              raise SystemExit("anonymous updater signature does not verify with the pinned public key") from exc

          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes.decode("utf-8"))
          asset = asset_path.read_bytes()
          if manifest.get("schema_version") != 2:
              raise SystemExit("anonymous Findings Pack manifest is not schema v2")
          if manifest.get("download_url") != "findings-pack.v2.zip":
              raise SystemExit("anonymous Findings Pack manifest points to an unexpected asset")
          if manifest.get("size") != len(asset):
              raise SystemExit("anonymous Findings Pack manifest size is stale")
          if manifest.get("sha256") != hashlib.sha256(asset).hexdigest():
              raise SystemExit("anonymous Findings Pack manifest hash is stale")
          verify_manifest_signature(manifest_bytes, manifest_signature_path.read_bytes())
          print("anonymous latest updater signature and Findings Pack endpoints verified")
          PY

      - name: Re-draft release after a failed publication check
        if: ${{ failure() && steps.create.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PROMOTION_ATTEMPT="$RUNNER_TEMP/release-promotion-attempt"
          PROMOTION_MARKER="$RUNNER_TEMP/release-promotion-marker"
          ID_FILE="$RUNNER_TEMP/release-identity"
          trap 'rm -f "$PROMOTION_ATTEMPT" "$PROMOTION_MARKER"' EXIT
          if [[ ! -s "$PROMOTION_ATTEMPT" ]]; then
            echo "this run did not attempt promotion; nothing to roll back"
            exit 0
          fi
          EXPECTED_TAG="$(sed -n '1p' "$PROMOTION_ATTEMPT")"
          EXPECTED_RELEASE_ID="$(sed -n '2p' "$PROMOTION_ATTEMPT")"
          if [[ "$EXPECTED_TAG" != "$TAG" || ! "$EXPECTED_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "promotion attempt marker does not identify this release; refusing rollback" >&2
            exit 1
          fi
          if [[ ! -s "$ID_FILE" || "$(sed -n '1p' "$ID_FILE")" != "$TAG" || "$(sed -n '2p' "$ID_FILE")" != "$EXPECTED_RELEASE_ID" ]]; then
            echo "promotion attempt is not owned by this run; refusing rollback" >&2
            exit 1
          fi
          if ! RELEASE_STATE="$(gh api \
            --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_ID}" \
            --jq '[.id, .tag_name, .draft] | @tsv' 2>/dev/null)"; then
            echo "owned release is unavailable; refusing rollback" >&2
            exit 1
          fi
          IFS=$'\t' read -r CURRENT_RELEASE_ID CURRENT_TAG CURRENT_IS_DRAFT <<< "$RELEASE_STATE"
          if [[ "$CURRENT_RELEASE_ID" != "$EXPECTED_RELEASE_ID" || "$CURRENT_TAG" != "$TAG" ]]; then
            echo "current release identity differs from this run; refusing rollback" >&2
            exit 1
          fi
          if [[ "$CURRENT_IS_DRAFT" == "true" ]]; then
            echo "failed release is already a draft"
            exit 0
          fi
          gh api \
            --method PATCH \
            --header "Accept: application/vnd.github+json" \
            --field "draft=true" \
            "repos/${GITHUB_REPOSITORY}/releases/${EXPECTED_RELEASE_ID}" \
            >/dev/null
          echo "failed release returned to draft state"
