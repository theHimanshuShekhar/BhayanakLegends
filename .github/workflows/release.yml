name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run verification only; never publish a release"
        required: true
        type: boolean
        default: true
      simulate_failure:
        description: "Fail a verification probe to prove publishing stays skipped"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact tagged tree before release
    uses: ./.github/workflows/verify.yml
    with:
      dry_run: ${{ inputs.dry_run || false }}
      simulate_failure: ${{ inputs.simulate_failure || false }}
    permissions:
      contents: read
  packaged-smoke:
    name: Smoke packaged Windows app before release
    uses: ./.github/workflows/windows-smoke.yml
    permissions:
      contents: read
  publish:
    name: Publish signed release
    needs: [verify, packaged-smoke]
    if: ${{ github.event_name == 'push' && needs.verify.result == 'success' && needs.packaged-smoke.result == 'success' }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check out exact tagged tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        shell: pwsh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1


      - name: Verify release tag version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" != v* || "${TAG#v}" == "$TAG" ]]; then
            echo "release workflow requires a v* tag" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          uv run --project backend --locked python - "$VERSION" <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          from bhayanak_legends.version import APP_VERSION

          expected = sys.argv[1]
          if not expected:
              raise SystemExit("release tag must include a version after v")
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          backend = tomllib.loads(
              Path("backend/pyproject.toml").read_text(encoding="utf-8")
          )
          cargo = tomllib.loads(Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"))
          backend_lock = tomllib.loads(
              Path("backend/uv.lock").read_text(encoding="utf-8")
          )
          cargo_lock = tomllib.loads(
              Path("src-tauri/Cargo.lock").read_text(encoding="utf-8")
          )
          backend_lock_version = next(
              (
                  entry.get("version")
                  for entry in backend_lock.get("package", [])
                  if entry.get("name") == "bhayanak-legends"
              ),
              None,
          )
          cargo_lock_version = next(
              (
                  entry.get("version")
                  for entry in cargo_lock.get("package", [])
                  if entry.get("name") == "bhayanak-legends"
              ),
              None,
          )
          versions = {
              "package.json": package.get("version"),
              "src-tauri/tauri.conf.json": tauri.get("version"),
              "src-tauri/Cargo.toml": cargo.get("package", {}).get("version"),
              "src-tauri/Cargo.lock": cargo_lock_version,
              "backend/pyproject.toml": backend.get("project", {}).get("version"),
              "backend/uv.lock": backend_lock_version,
              "backend/src/bhayanak_legends/version.py": APP_VERSION,
          }
          mismatches = {
              source: version for source, version in versions.items() if version != expected
          }
          if mismatches:
              details = ", ".join(f"{source}={version!r}" for source, version in mismatches.items())
              raise SystemExit(
                  "release tag version must exactly match every application version source: "
                  + details
              )
          print("release tag version matches every application version source")
          PY
      - name: Verify immutable release tag and empty release slot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          REF_PATH="repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          TAG_TYPE="$(gh api "$REF_PATH" --jq '.object.type')"
          TAG_OBJECT="$(gh api "$REF_PATH" --jq '.object.sha')"
          if [[ "$TAG_TYPE" == "tag" ]]; then
            TAG_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" --jq '.object.type')"
            TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" --jq '.object.sha')"
          fi
          if [[ "$TAG_TYPE" != "commit" || "$TAG_OBJECT" != "$GITHUB_SHA" ]]; then
            echo "release tag does not resolve immutably to the checked-out commit" >&2
            exit 1
          fi
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "release already exists; refusing to mutate immutable tag assets" >&2
            exit 1
          fi
          echo "release tag resolves to the checked-out commit and has no existing release"

      - name: Build Python sidecar binary
        shell: bash
        run: uv run --project backend --locked python tools/build_windows_sidecar.py
      - name: Build canonical Findings Pack release payload
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --project backend --locked python tools/build_findings_pack_release.py \
            --pack-dir pack \
            --asset "$RUNNER_TEMP/findings-pack.v2.zip" \
            --manifest "$RUNNER_TEMP/findings-pack-manifest.json" \
            --download-url "findings-pack.v2.zip" \
            --min-app-version "0.1.0"

      - name: Sign Findings Pack manifest
        shell: bash
        env:
          FINDINGS_PACK_MANIFEST_SIGNING_KEY: ${{ secrets.FINDINGS_PACK_MANIFEST_SIGNING_KEY }}
        run: |
          uv run --project backend --locked python tools/sign_findings_pack_manifest.py \
            "$RUNNER_TEMP/findings-pack-manifest.json" \
            --output "$RUNNER_TEMP/findings-pack-manifest.json.sig"
      - name: Verify generated Findings Pack payload
        shell: bash
        env:
          PACK_MANIFEST_PATH: ${{ runner.temp }}/findings-pack-manifest.json
          PACK_SIGNATURE_PATH: ${{ runner.temp }}/findings-pack-manifest.json.sig
          PACK_ASSET_PATH: ${{ runner.temp }}/findings-pack.v2.zip
        run: |
          uv run --project backend --locked python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from bhayanak_legends.manifest_signing import verify_manifest_signature

          manifest_path = Path(os.environ["PACK_MANIFEST_PATH"])
          signature_path = Path(os.environ["PACK_SIGNATURE_PATH"])
          asset_path = Path(os.environ["PACK_ASSET_PATH"])
          raw_manifest = manifest_path.read_bytes()
          manifest = json.loads(raw_manifest.decode("utf-8"))
          asset = asset_path.read_bytes()
          if manifest["schema_version"] != 2:
              raise SystemExit("generated Findings Pack manifest is not schema v2")
          if manifest["size"] != len(asset):
              raise SystemExit("generated Findings Pack manifest size is stale")
          if manifest["sha256"] != hashlib.sha256(asset).hexdigest():
              raise SystemExit("generated Findings Pack manifest hash is stale")
          verify_manifest_signature(raw_manifest, signature_path.read_bytes())
          print("generated Findings Pack manifest, payload, and signature match")
          PY


      - name: Verify updater signing prerequisites
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo "updater signing key/password secrets are not provisioned; refusing to publish unsigned updates" >&2
            exit 1
          fi
          PROBE_FILE="$RUNNER_TEMP/updater-signing-probe"
          PROBE_SIGNATURE="$PROBE_FILE.sig"
          trap 'rm -f "$PROBE_FILE" "$PROBE_SIGNATURE"' EXIT
          rm -f "$PROBE_FILE" "$PROBE_SIGNATURE"
          printf 'Bhayanak Legends updater signing probe\n' > "$PROBE_FILE"
          if ! pnpm tauri signer sign "$PROBE_FILE" >/dev/null 2>/dev/null
          then
            echo "updater signing probe failed; refusing to publish" >&2
            exit 1
          fi
          uv run --project backend --locked python - "$PROBE_FILE" "$PROBE_SIGNATURE" <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          import sys
          from pathlib import Path

          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          probe_path = Path(sys.argv[1])
          signature_path = Path(sys.argv[2])
          config = json.loads(
              Path("src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )
          bundle = config.get("bundle")
          if not isinstance(bundle, dict) or bundle.get("createUpdaterArtifacts") is not True:
              raise SystemExit("createUpdaterArtifacts must be true before publishing")
          updater = config.get("plugins", {}).get("updater")
          if not isinstance(updater, dict) or not updater.get("pubkey"):
              raise SystemExit("pinned updater public key is missing")
          encoded_public = updater["pubkey"]

          def payload_line(text: str) -> str:
              for line in text.splitlines():
                  line = line.strip()
                  if line and not line.endswith("comment:") and not line.startswith(
                      ("untrusted comment:", "trusted comment:")
                  ):
                      return line
              raise ValueError("minisign payload is missing")

          def minisign_payload(text: str, label: str) -> bytes:
              try:
                  return base64.b64decode(payload_line(text), validate=True)
              except (ValueError, binascii.Error) as exc:
                  raise SystemExit(f"{label} has an invalid minisign payload") from exc

          def minisign_signature(text: str, label: str) -> tuple[bytes, bytes, bytes]:
              lines = text.splitlines()
              if (
                  len(lines) != 4
                  or not lines[0].startswith("untrusted comment: ")
                  or not lines[2].startswith("trusted comment: ")
                  or not lines[2][len("trusted comment: ") :].strip()
              ):
                  raise SystemExit(f"{label} is missing a Minisign comment or signature")
              try:
                  primary = base64.b64decode(lines[1].strip(), validate=True)
                  global_signature = base64.b64decode(lines[3].strip(), validate=True)
                  trusted_comment = lines[2][len("trusted comment: ") :].strip().encode("ascii")
              except (UnicodeError, ValueError, binascii.Error) as exc:
                  raise SystemExit(f"{label} has an invalid Minisign signature") from exc
              if len(primary) != 74 or len(global_signature) != 64:
                  raise SystemExit(f"{label} has an invalid Minisign signature size")
              return primary, global_signature, trusted_comment

          try:
              public_text = base64.b64decode(encoded_public.strip(), validate=True).decode("ascii")
              public_blob = minisign_payload(public_text, "pinned public key")
              signature_wrapper = signature_path.read_bytes()
              signature_text = base64.b64decode(
                  signature_wrapper.strip(), validate=True
              ).decode("ascii")
              signature_blob, global_signature, trusted_comment = minisign_signature(
                  signature_text, "updater signing probe"
              )
          except (UnicodeError, OSError, ValueError, binascii.Error) as exc:
              raise SystemExit("updater signing probe payload is malformed") from exc
          if len(public_blob) != 42:
              raise SystemExit("pinned updater public key has an invalid Minisign payload")
          if public_blob[:2] != b"Ed" or signature_blob[:2] != b"ED":
              raise SystemExit("updater signing probe uses an unsupported minisign algorithm")
          if public_blob[2:10] != signature_blob[2:10]:
              raise SystemExit("updater signing probe used a key different from the pinned public key")
          probe_bytes = probe_path.read_bytes()
          probe_digest = hashlib.blake2b(probe_bytes, digest_size=64).digest()
          try:
              verifier = Ed25519PublicKey.from_public_bytes(public_blob[10:])
              verifier.verify(signature_blob[10:], probe_digest)
              verifier.verify(global_signature, signature_blob[10:] + trusted_comment)
          except (InvalidSignature, ValueError) as exc:
              raise SystemExit("updater signing probe does not verify with the pinned public key") from exc
          print("updater signing key and password verified against the pinned public key")
          PY
      - name: Build Windows updater bundle
        shell: pwsh
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage canonical Windows updater assets
        shell: bash
        env:
          STAGED_BUNDLE_DIR: ${{ runner.temp }}/updater-bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_BUNDLE_DIR="src-tauri/target/release/bundle/nsis"
          rm -rf "$STAGED_BUNDLE_DIR"
          mkdir -p "$STAGED_BUNDLE_DIR"
          uv run --project backend --locked python - \
            "$SOURCE_BUNDLE_DIR" \
            "$STAGED_BUNDLE_DIR" \
            "$VERSION" <<'PY'
          import filecmp
          import shutil
          import sys
          from pathlib import Path

          source_dir = Path(sys.argv[1])
          staged_dir = Path(sys.argv[2])
          version = sys.argv[3]
          installers = sorted(
              path
              for path in source_dir.iterdir()
              if path.is_file() and path.name.lower().endswith(".exe")
          )
          candidates = sorted(
              path
              for path in source_dir.iterdir()
              if path.is_file()
              and (
                  path.name.lower().endswith(".exe")
                  or path.name.lower().endswith(".nsis.zip")
              )
          )
          signed_updaters = [
              path for path in candidates if path.with_name(path.name + ".sig").is_file()
          ]
          if len(installers) != 1:
              raise SystemExit("Windows NSIS installer inventory is not exactly one file")
          if len(signed_updaters) != 1:
              raise SystemExit(
                  "Windows updater inventory is not exactly one signed updater candidate"
              )
          installer = installers[0]
          updater = signed_updaters[0]
          if updater.name.lower().endswith(".exe") and updater != installer:
              raise SystemExit(
                  "signed Windows updater executable is not the unique installer"
              )
          signature = updater.with_name(updater.name + ".sig")
          if updater == installer:
              canonical_updater = staged_dir / f"bhayanak-legends-{version}-windows-x86_64-setup.exe"
              targets = {
                  installer: canonical_updater,
                  signature: canonical_updater.with_name(canonical_updater.name + ".sig"),
              }
          else:
              canonical_installer = staged_dir / f"bhayanak-legends-{version}-setup.exe"
              canonical_updater = (
                  staged_dir / f"bhayanak-legends-{version}-windows-x86_64.nsis.zip"
              )
              targets = {
                  installer: canonical_installer,
                  updater: canonical_updater,
                  signature: canonical_updater.with_name(canonical_updater.name + ".sig"),
              }
          for source, target in targets.items():
              shutil.copyfile(source, target)
              if not filecmp.cmp(source, target, shallow=False):
                  raise SystemExit(f"staged updater asset bytes differ: {source.name}")
          PY

      - name: Check Windows updater artifacts
        shell: bash
        env:
          STAGED_BUNDLE_DIR: ${{ runner.temp }}/updater-bundle
          LATEST_JSON_PATH: ${{ runner.temp }}/latest.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --project backend --locked python tools/check_windows_updater_artifacts.py \
            --bundle-dir "$STAGED_BUNDLE_DIR" \
            --latest-json "$LATEST_JSON_PATH" \
            --write-latest-json \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}" \
            --version "$VERSION"

      - name: Inventory exact updater assets before draft creation
        shell: bash
        env:
          INVENTORY_PATH: ${{ runner.temp }}/release-inventory.json
          LATEST_JSON_PATH: ${{ runner.temp }}/latest.json
          STAGED_BUNDLE_DIR: ${{ runner.temp }}/updater-bundle
        run: |
          set -euo pipefail
          uv run --project backend --locked python - \
            "$INVENTORY_PATH" \
            "$LATEST_JSON_PATH" \
            "$STAGED_BUNDLE_DIR" \
            "$GITHUB_REF_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          inventory_path = Path(sys.argv[1])
          latest_path = Path(sys.argv[2])
          bundle_dir = Path(sys.argv[3])
          tag = sys.argv[4]
          installers = sorted(
              path
              for path in bundle_dir.iterdir()
              if path.is_file() and path.name.lower().endswith(".exe")
          )
          candidates = sorted(
              path
              for path in bundle_dir.iterdir()
              if path.is_file()
              and (
                  path.name.lower().endswith(".exe")
                  or path.name.lower().endswith(".nsis.zip")
              )
          )
          signed_updaters = [
              path for path in candidates if path.with_name(path.name + ".sig").is_file()
          ]
          if len(installers) != 1:
              raise SystemExit("Windows NSIS installer inventory is not exactly one file")
          if len(signed_updaters) != 1:
              raise SystemExit(
                  "Windows updater inventory is not exactly one signed updater candidate"
              )
          installer = installers[0]
          updater = signed_updaters[0]
          if updater.name.lower().endswith(".exe") and updater != installer:
              raise SystemExit(
                  "signed Windows updater executable is not the unique installer"
              )
          signature = updater.with_name(updater.name + ".sig")
          latest = json.loads(latest_path.read_text(encoding="utf-8"))
          expected_version = tag.removeprefix("v")
          if latest.get("version") != expected_version:
              raise SystemExit("latest.json version does not match the release tag")
          platform = latest.get("platforms", {}).get("windows-x86_64")
          if not isinstance(platform, dict):
              raise SystemExit("latest.json Windows updater entry is missing")
          if unquote(urlsplit(platform.get("url", "")).path.rsplit("/", 1)[-1]) != updater.name:
              raise SystemExit("latest.json does not reference the unique updater archive")
          signature_text = signature.read_text(encoding="utf-8")
          if platform.get("signature") != signature_text:
              raise SystemExit("latest.json signature does not match the unique detached signature")
          asset_names = list(dict.fromkeys((installer.name, updater.name, signature.name)))
          inventory_path.write_text(
              json.dumps(
                  {
                      "tag": tag,
                      "version": expected_version,
                      "installer": installer.name,
                      "updater": updater.name,
                      "signature": signature.name,
                      "assets": asset_names,
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create signed release draft
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          CREATE_RESPONSE="$RUNNER_TEMP/release-create-response.json"
          gh api \
            --method POST \
            --header "Accept: application/vnd.github+json" \
            --field "tag_name=$TAG" \
            --field "target_commitish=$GITHUB_SHA" \
            --field "name=Bhayanak Legends v${VERSION}" \
            --field "body=Installer + auto-update feed. The Findings Pack is bundled; newer packs arrive via LoLTrends release sync (docs/adr/0005)." \
            --field "draft=true" \
            --field "prerelease=false" \
            "repos/${GITHUB_REPOSITORY}/releases" > "$CREATE_RESPONSE"
          RELEASE_ID_AND_UPLOAD_URL="$(uv run --project backend --locked python - \
            "$CREATE_RESPONSE" "$TAG" "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_tag = sys.argv[2]
          expected_repository = sys.argv[3]
          if payload.get("tag_name") != expected_tag or payload.get("draft") is not True:
              raise SystemExit("GitHub did not create the requested draft release")
          release_id = payload.get("id")
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit("GitHub draft response did not contain a valid release ID")
          upload_url = payload.get("upload_url")
          template = "{?name,label}"
          if not isinstance(upload_url, str) or not upload_url.endswith(template):
              raise SystemExit("GitHub draft response has an invalid upload URL template")
          upload_base = upload_url[: -len(template)]
          parsed = urlsplit(upload_base)
          expected_path = f"/repos/{expected_repository}/releases/{release_id}/assets"
          if (
              parsed.scheme != "https"
              or parsed.netloc != "uploads.github.com"
              or parsed.path != expected_path
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("GitHub draft response has an invalid upload URL")
          print(f"{release_id}\t{upload_base}")
          PY
          )"
          IFS=$'\t' read -r RELEASE_ID UPLOAD_URL <<< "$RELEASE_ID_AND_UPLOAD_URL"
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ || -z "$UPLOAD_URL" ]]; then
            echo "GitHub draft response did not yield a valid release identity" >&2
            exit 1
          fi
          printf '%s\n%s\n%s\n' "$TAG" "$RELEASE_ID" "$UPLOAD_URL" > "$RUNNER_TEMP/release-identity"

      - name: Upload exact updater and Findings Pack assets to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVENTORY_PATH: ${{ runner.temp }}/release-inventory.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ID_FILE="$RUNNER_TEMP/release-identity"
          STAGED_BUNDLE_DIR="$RUNNER_TEMP/updater-bundle"
          if [[ ! -s "$ID_FILE" || "$(sed -n '1p' "$ID_FILE")" != "$TAG" ]]; then
            echo "release identity marker is missing or points to another tag" >&2
            exit 1
          fi
          RELEASE_ID="$(sed -n '2p' "$ID_FILE")"
          UPLOAD_URL="$(sed -n '3p' "$ID_FILE")"
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "release identity marker has an invalid release ID" >&2
            exit 1
          fi
          EXPECTED_UPLOAD_URL="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets"
          if [[ "$UPLOAD_URL" != "$EXPECTED_UPLOAD_URL" ]]; then
            echo "release identity marker has an invalid upload URL" >&2
            exit 1
          fi
          RELEASE_STATE="$(gh api \
            --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '[.id, .tag_name, .draft] | @tsv')"
          IFS=$'\t' read -r CURRENT_ID CURRENT_TAG CURRENT_DRAFT <<< "$RELEASE_STATE"
          if [[ "$CURRENT_ID" != "$RELEASE_ID" || "$CURRENT_TAG" != "$TAG" || "$CURRENT_DRAFT" != "true" ]]; then
            echo "release identity or draft state changed before asset upload" >&2
            exit 1
          fi
          mapfile -t EXISTING_ASSETS < <(
            gh api \
              --header "Accept: application/vnd.github+json" \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq '.[].name'
          )
          if [[ "${#EXISTING_ASSETS[@]}" -ne 0 ]]; then
            echo "new release unexpectedly already has assets; refusing to overwrite" >&2
            exit 1
          fi
          mapfile -t UPDATER_ASSETS < <(
            uv run --project backend --locked python - "$INVENTORY_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          inventory = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
