name: Verify

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Mark this invocation as a non-publishing verification run"
        required: false
        type: boolean
        default: false
      simulate_failure:
        description: "Intentionally fail a probe to exercise release gating"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run gates without publishing anything"
        required: true
        type: boolean
        default: true
      simulate_failure:
        description: "Intentionally fail a probe to exercise release gating"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
      - name: Run backend tests
        working-directory: backend
        run: uv sync --locked && uv run pytest -q

  frontend-tests:
    name: Frontend vitest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm vitest run

  frontend-build:
    name: Production frontend build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production frontend
        run: pnpm build

  e2e:
    name: Playwright with seeded sidecar
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps
      - name: Start sidecar
        working-directory: backend
        run: |
          uv sync --locked
          BHAYANAK_PORT=23110 \
          BHAYANAK_TOKEN=dev \
          BHAYANAK_ALLOW_IMPORT=true \
          BHAYANAK_IMPORT_ROOTS='["${{ github.workspace }}/data/dev-import"]' \
            nohup uv run python -m bhayanak_legends.sidecar > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent -H "X-BL-Token: dev" http://127.0.0.1:23110/health; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sidecar.log"
          exit 1
      - name: Seed deterministic Personal History when no import exists
        run: |
          if [ -d data/dev-import ]; then
            echo "Using committed data/dev-import fixtures"
          else
            (cd backend && uv run python tools/ci_seed.py)
          fi
      - name: Run Playwright
        run: VITE_BL_PORT=23110 VITE_BL_TOKEN=dev pnpm exec playwright test

  dependency-audit-javascript:
    name: JavaScript dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=high

  dependency-audit-python:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v6.3.1
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          uv sync --locked
          set +e
          uvx --from pip-audit pip-audit --strict --format json > "$RUNNER_TEMP/pip-audit.json"
          audit_status=$?
          set -e
          AUDIT_STATUS="$audit_status" python - "$RUNNER_TEMP/pip-audit.json" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          try:
              report = json.load(open(path, encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"pip-audit did not produce JSON: {exc}")

          vulnerabilities = []
          for dependency in report.get("dependencies", []):
              for vuln in dependency.get("vulns", []):
                  vulnerabilities.append((dependency.get("name", "unknown"), vuln))
          for vuln in report.get("vulnerabilities", []):
              vulnerabilities.append((vuln.get("name", "unknown"), vuln))

          for package, vuln in vulnerabilities:
              print(f"{package}: {vuln.get('id', 'unknown advisory')} ({vuln.get('severity', 'unknown severity')})")
          if int(os.environ["AUDIT_STATUS"]) and not vulnerabilities:
              raise SystemExit("pip-audit failed without reporting an advisory")

          actionable = {"high", "critical"}
          unknown = []
          for _, vuln in vulnerabilities:
              severity = str(vuln.get("severity", "unknown")).lower()
              if severity in actionable or severity not in {"moderate", "medium", "low"}:
                  unknown.append(vuln.get("id", "unknown advisory"))
          if unknown:
              raise SystemExit("Python dependency advisories require triage: " + ", ".join(unknown))
          PY

  dependency-audit-rust:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact triggering tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          set +e
          cargo audit --json > "$RUNNER_TEMP/cargo-audit.json"
          audit_status=$?
          set -e
          AUDIT_STATUS="$audit_status" python - "$RUNNER_TEMP/cargo-audit.json" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          try:
              report = json.load(open(path, encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"cargo-audit did not produce JSON: {exc}")

          advisories = report.get("vulnerabilities", {}).get("list", [])
          moderate_exception = {"RUSTSEC-2024-0429"}
          actionable = []
          for item in advisories:
              advisory = item.get("advisory", {})
              advisory_id = advisory.get("id", "unknown advisory")
              severity = str(advisory.get("severity", "unknown")).lower()
              if advisory_id in moderate_exception:
                  severity = "moderate"
              print(f"{advisory_id}: {severity}")
              if severity in {"high", "critical"} or severity not in {"moderate", "medium", "low"}:
                  actionable.append(advisory_id)
          if int(os.environ["AUDIT_STATUS"]) and not advisories:
              raise SystemExit("cargo-audit failed without reporting an advisory")
          if actionable:
              raise SystemExit("Rust dependency advisories require triage: " + ", ".join(actionable))
          PY

  failure-probe:
    name: Dry-run failure probe
    if: ${{ inputs.simulate_failure }}
    runs-on: ubuntu-24.04
    steps:
      - name: Intentionally fail without publishing
        run: exit 1
