<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Rift Coach</title>
  </head>
  <body>
    <div id="update-banner" class="hidden">
      <span id="update-label"></span>
      <button id="update-install">Restart to install</button>
    </div>
    <div class="flex h-screen flex-col overflow-hidden">
      <header
        class="flex h-[38px] shrink-0 items-center gap-3 bg-rc-deep px-4 shadow-z1"
      >
        <div
          class="grid h-[16px] w-[16px] place-items-center rounded-[5px] bg-linear-to-br from-rc-acc to-rc-acc-lo text-[8px] font-bold text-rc-deep shadow-[0_0_14px_-2px_rgba(145,132,217,.8)]"
        >
          R
        </div>
        <span class="text-[13px] font-bold tracking-[0.1em]"
          >RIFT&nbsp;COACH</span
        >
        <span class="text-[9px] text-rc-dimmer">v0.1</span>
        <div class="ml-auto flex items-center gap-3">
          <span id="rank-label" class="pill-s2 !text-[9px]">—</span>
          <span class="text-[10px] text-rc-dim" id="summoner-label">—</span>
        </div>
      </header>
      <nav
        class="flex h-[52px] shrink-0 items-center gap-2 border-b border-rc-line bg-rc-bg px-4 shadow-z1"
      >
        <div id="nav-pills" class="flex items-center gap-1.5"></div>
        <div id="dev-toggle" class="ml-2 hidden items-center gap-1"></div>
        <div class="ml-auto flex items-center gap-2.5">
          <span
            class="h-[7px] w-[7px] rounded-full bg-rc-teal shadow-[0_0_10px_rgba(87,207,180,.9)]"
          ></span>
          <span class="text-[9px] tracking-[0.12em] text-rc-teal"
            >LIVE CLIENT · CONNECTED</span
          >
        </div>
      </nav>
      <main id="view" class="min-h-0 flex-1 overflow-y-auto"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
